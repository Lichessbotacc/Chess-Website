<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lichess Arena Lite</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
}

header {
  text-align: center;
  padding: 10px;
  background: #111;
  font-size: 18px;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

#board {
  width: 420px;
}

.panel {
  width: 340px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn, input {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
}

.btn:hover {
  background: #666;
}

.box {
  margin-top: 10px;
  background: #111;
  padding: 8px;
  border-radius: 5px;
  font-size: 13px;
  max-height: 220px;
  overflow-y: auto;
}
</style>
</head>

<body>

<header>♟ Lichess Arena Lite (Fixed Live Version)</header>

<div class="container">

<div id="board"></div>

<div class="panel">

<h3>Arena Setup</h3>

<label>Bot Anzahl</label>
<input id="botCount" type="number" min="2" max="20" value="5">

<button class="btn" onclick="startArena()">Start Arena</button>

<h3>Live Games</h3>
<div class="box" id="liveGames"></div>

<h3>Leaderboard</h3>
<div class="box" id="results"></div>

</div>
</div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

// ♟ Main board (optional display only)
let board = Chessboard('board', {
  position: 'start',
  draggable: false,
  pieceTheme: 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/img/chesspieces/wikipedia/{piece}.png'
});

// ---------------- STATE ----------------

let bots = [];
let scores = {};
let pairs = [];
let games = [];
let boards = {};
let running = false;

// ---------------- START ARENA ----------------

function startArena() {

  let count = parseInt(document.getElementById("botCount").value);

  bots = [];
  scores = {};
  pairs = [];
  games = [];
  boards = {};

  document.getElementById("liveGames").innerHTML = "";
  document.getElementById("results").innerHTML = "";

  for (let i = 1; i <= count; i++) {
    let name = "Bot " + i;
    bots.push(name);
    scores[name] = 0;
  }

  // Round Robin Pairings (Lichess style light)
  for (let i = 0; i < bots.length; i++) {
    for (let j = i + 1; j < bots.length; j++) {
      pairs.push([bots[i], bots[j]]);
    }
  }

  running = true;

  nextMatch();
}

// ---------------- MATCH LOOP ----------------

function nextMatch() {

  if (!running || pairs.length === 0) {
    renderScores();
    return;
  }

  let [white, black] = pairs.shift();

  let gameObj = {
    id: Date.now() + Math.random(),
    white,
    black,
    game: new Chess(),
    moves: []
  };

  games.push(gameObj);

  createGameUI(gameObj);
  playGame(gameObj);

  renderScores();

  setTimeout(nextMatch, 250);
}

// ---------------- CREATE LIVE BOARD ----------------

function createGameUI(g) {

  let id = "board_" + g.id;

  let wrapper = document.createElement("div");

  wrapper.innerHTML = `
    <div style="margin-bottom:10px;">
      <b>${g.white} vs ${g.black}</b>
      <div id="${id}" style="width:200px;"></div>
      <small id="moves_${g.id}"></small>
    </div>
    <hr>
  `;

  document.getElementById("liveGames").prepend(wrapper);

  boards[g.id] = Chessboard(id, {
    position: 'start',
    draggable: false,
    pieceTheme: 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/img/chesspieces/wikipedia/{piece}.png'
  });
}

// ---------------- GAME SIMULATION ----------------

function playGame(gObj) {

  let g = gObj.game;
  let turn = 0;

  let interval = setInterval(() => {

    if (g.game_over() || turn > 50) {
      clearInterval(interval);
      finishGame(gObj);
      return;
    }

    let bot = g.turn() === "w" ? gObj.white : gObj.black;

    let move = getMove(g, bot);
    g.move(move);

    gObj.moves.push(move);

    boards[gObj.id].position(g.fen());

    document.getElementById("moves_" + gObj.id).innerText =
      gObj.moves.slice(-6).join(" ");

    turn++;

  }, 120);
}

// ---------------- RESULT SYSTEM (FIXED) ----------------

function finishGame(gObj) {

  let g = gObj.game;

  let white = gObj.white;
  let black = gObj.black;

  if (g.in_checkmate()) {
    let winner = g.turn() === "w" ? black : white;
    scores[winner] += 2;
  } else {
    scores[white] += 1;
    scores[black] += 1;
  }

  renderScores();
}

// ---------------- BOT LOGIC ----------------

function getMove(game, bot) {

  let moves = game.moves();

  if (!moves.length) return null;

  if (bot.includes("1") || bot.includes("2")) {
    return moves[0];
  }

  if (bot.includes("3") || bot.includes("4")) {
    return moves[Math.floor(Math.random() * Math.max(1, moves.length / 2))];
  }

  return moves[Math.floor(Math.random() * moves.length)];
}

// ---------------- LEADERBOARD ----------------

function renderScores() {

  let sorted = Object.entries(scores)
    .sort((a,b) => b[1] - a[1]);

  let html = "<b>Leaderboard</b><br><br>";

  sorted.forEach((p, i) => {
    html += `${i+1}. ${p[0]} — ${p[1]} pts<br>`;
  });

  document.getElementById("results").innerHTML = html;
}

</script>

</body>
</html>
