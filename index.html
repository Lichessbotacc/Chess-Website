<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Chess Website</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #board {
      width: 90vw;
      max-width: 500px;
      margin: auto;
    }
  </style>
</head>
<body>

  <h1>My Chess Website</h1>

  <div id="board"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script>
    const game = new Chess()

    const board = Chessboard('board', {
      draggable: true,
      position: 'start',

      onDrop: function(source, target) {

        const move = game.move({
          from: source,
          to: target,
          promotion: 'q'
        })

        if (move === null) {
          return 'snapback'
        }
      }
    })
  </script>

</body>
</html>
