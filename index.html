<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Arena</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#202124;
  color:white;
}

header {
  padding:10px;
  background:#111;
  text-align:center;
}

.container {
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:15px;
}

.panel {
  width:320px;
  background:#2a2a2a;
  padding:10px;
  border-radius:8px;
}

button, input {
  width:100%;
  padding:10px;
  margin-top:10px;
}

button {
  background:#444;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover {
  background:#666;
}

#boards {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  max-width:900px;
}

.game {
  background:#111;
  padding:8px;
  border-radius:6px;
}
canvas {
  background:#ddd;
}
</style>
</head>

<body>

<header>♟ Bot Arena (echte Partien)</header>

<div class="container">

<div id="boards"></div>

<div class="panel">
<h3>Arena Setup</h3>
<input id="botCount" type="number" value="6" min="2" max="20">
<button onclick="startArena()">Start</button>

<h3>Leaderboard</h3>
<div id="scores"></div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>

let bots = [];
let scores = {};
let pairs = [];

function startArena() {

  console.log("START clicked");

  let count = parseInt(document.getElementById("botCount").value);

  bots = [];
  scores = {};
  pairs = [];

  document.getElementById("boards").innerHTML = "";

  for (let i = 1; i <= count; i++) {
    let name = "Bot " + i;
    bots.push(name);
    scores[name] = 0;
  }

  console.log("Bots:", bots);

  for (let i = 0; i < bots.length; i++) {
    for (let j = i + 1; j < bots.length; j++) {
      pairs.push([bots[i], bots[j]]);
    }
  }

  console.log("Pairs:", pairs);

  nextGame();
}

// ---------------- GAME LOOP ----------------

function nextGame() {
  if (pairs.length === 0) {
    renderScores();
    return;
  }

  let [w,b] = pairs.shift();
  let game = new Chess();

  let ui = createBoardUI(w,b);

  playGame(game, w, b, ui);

  setTimeout(nextGame, 500);
}

// ---------------- UI ----------------

function createBoardUI(w,b){
  let div = document.createElement("div");
  div.className="game";

  let canvas = document.createElement("canvas");
  canvas.width = 160;
  canvas.height = 160;
  canvas.style.border = "2px solid red";

  div.innerHTML = `<b>${w} vs ${b}</b><br>`;
  div.appendChild(canvas);

  document.getElementById("boards").prepend(div);

  return canvas.getContext("2d");
}

// ---------------- BOT ----------------

function botMove(game){
  let moves = game.moves();
  return moves[Math.floor(Math.random()*moves.length)];
}

// ---------------- PLAY ----------------

function playGame(game, white, black, ctx){

  let interval = setInterval(()=>{

    if (game.isGameOver()){

      clearInterval(interval);

      let winner = getWinner(game, white, black);
      if (winner) scores[winner] += 2;

      renderScores();
      return;
    }

    let move = botMove(game);
    game.move(move);

    draw(game, ctx);

  }, 120);
}

// ---------------- WINNER ----------------

function getWinner(game, white, black){

  if (game.in_checkmate()) {
    return game.turn() === "w" ? black : white;
  }

  return null;
}

// ---------------- DRAW BOARD ----------------

const pieces = {
  p:"♟", r:"♜", n:"♞", b:"♝", q:"♛", k:"♚",
  P:"♙", R:"♖", N:"♘", B:"♗", Q:"♕", K:"♔"
};

function draw(game, ctx){

  ctx.clearRect(0,0,160,160);

  let board = game.board();

  for (let i = 0; i < 8; i++){
    for (let j = 0; j < 8; j++){

      ctx.fillStyle = (i + j) % 2 ? "#769656" : "#eeeed2";
      ctx.fillRect(j * 20, i * 20, 20, 20);

      let piece = board[i][j];

      if (piece){
        let symbol = pieces[piece.type];

        if (piece.color === "w") {
          symbol = symbol.toUpperCase();
        }

        ctx.fillStyle = "black";
        ctx.font = "16px Arial";
        ctx.fillText(symbol, j * 20 + 4, i * 20 + 15);
      }
    }
  }
}

// ---------------- SCORE ----------------

function renderScores(){

  let sorted = Object.entries(scores)
    .sort((a,b)=>b[1]-a[1]);

  let html = "<b>Leaderboard</b><br><br>";

  sorted.forEach((p,i)=>{
    html += `${i+1}. ${p[0]} — ${p[1]} pts<br>`;
  });

  document.getElementById("scores").innerHTML = html;
}

</script>

</body>
</html>
