<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess Arena</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<style>
body{
  margin:0;
  background:#1f1f1f;
  color:white;
  font-family:Arial;
}

header{
  background:#111;
  padding:15px;
  font-size:24px;
  font-weight:bold;
  text-align:center;
  border-bottom:2px solid #333;
}

.controls{
  text-align:center;
  margin:20px;
}

button{
  background:#8bc34a;
  border:none;
  color:black;
  padding:12px 20px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.board-card{
  background:#2b2b2b;
  border-radius:14px;
  padding:15px;
  width:360px;
  box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.player-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-weight:bold;
}

.board{
  width:330px;
  margin:auto;
}

.status{
  text-align:center;
  margin-top:10px;
  color:#aaa;
}

.ranking{
  max-width:900px;
  margin:auto;
  padding:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#2b2b2b;
  border-radius:10px;
  overflow:hidden;
}

th,td{
  padding:12px;
  border-bottom:1px solid #444;
  text-align:center;
}

th{
  background:#111;
}
</style>
</head>

<body>

<header>♟ Mini Lichess Arena</header>

<div class="controls">
  <button onclick="startArena()">Arena starten</button>
</div>

<div class="container" id="games"></div>

<div class="ranking">
  <h2>🏆 Ranking</h2>

  <table>
    <thead>
      <tr>
        <th>Platz</th>
        <th>Bot</th>
        <th>Punkte</th>
      </tr>
    </thead>

    <tbody id="rankingBody"></tbody>
  </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stockfish@11/stockfish.min.js"></script>

<script>
const BOT_COUNT = 10;
const MOVE_DELAY = 100;
const TOURNAMENT_MINUTES = 10;

let arenaRunning = false;
let tournamentEnd = 0;

const botNames = [
  "Seher",
  "Berkay",
  "Metin",
  "Melda",
  "Melisa",
  "Onur",
  "Anas",
  "Ahmet",
  "Anes",
  "Hatice"
];

const bots = [];

for(let i=0;i<BOT_COUNT;i++){

  bots.push({
    name: botNames[i % botNames.length] + "_" + (i+1),
    elo: 1800 + Math.floor(Math.random()*300),
    score:0,
    busy:false
  });
}

function updateRanking(){

  const tbody =
    document.getElementById("rankingBody");

  bots.sort((a,b)=>b.score-a.score);

  tbody.innerHTML = "";

  bots.forEach((bot,index)=>{

    tbody.innerHTML += `
      <tr>
        <td>${index+1}</td>
        <td>${bot.name}</td>
        <td>${bot.score}</td>
      </tr>
    `;
  });
}

function pickPair(){

  const free = bots.filter(b=>!b.busy);

  if(free.length < 2) return null;

  free.sort(()=>Math.random()-0.5);

  const a = free[0];
  const b = free[1];

  a.busy = true;
  b.busy = true;

  return [a,b];
}

function createBoard(bot1, bot2, id){

  const games =
    document.getElementById("games");

  const card =
    document.createElement("div");

  card.className = "board-card";

  card.innerHTML = `
    <div class="player-row">
      <span>⚪ ${bot1.name}</span>
      <span>${bot1.elo}</span>
    </div>

    <div id="board${id}" class="board"></div>

    <div class="player-row">
      <span>⚫ ${bot2.name}</span>
      <span>${bot2.elo}</span>
    </div>

    <div class="status" id="status${id}">
      Partie läuft...
    </div>
  `;

  games.appendChild(card);

  const game = new Chess();

  const board = Chessboard(`board${id}`,{
    position:"start",
    draggable:false,
    pieceTheme:
    "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png"
  });

  const engine = STOCKFISH();

  engine.postMessage("uci");

  engine.postMessage(
    "setoption name Skill Level value 3"
  );

  playGame({
    game,
    board,
    engine,
    bot1,
    bot2,
    id,
    card
  });
}

function getBestMove(engine, game){

  return new Promise(resolve=>{

    const fen = game.fen();

    engine.onmessage = function(event){

      let line = event;

      if(typeof event === "object"){
        line = event.data;
      }

      console.log(line);

      if(line.startsWith("bestmove")){

        const move =
          line.split(" ")[1];

        resolve(move);
      }
    };

    engine.postMessage(
      "position fen " + fen
    );

    engine.postMessage("go depth 2");
  });
}

function playGame(match){

  const {
    game,
    board,
    engine,
    bot1,
    bot2,
    id,
    card
  } = match;

  let thinking = false;

  const interval = setInterval(async ()=>{

    if(!arenaRunning){

      clearInterval(interval);
      return;
    }

    if(Date.now() >= tournamentEnd){

      clearInterval(interval);

      document.getElementById(
        `status${id}`
      ).innerText = "🏁 Turnier beendet";

      return;
    }

    if(game.game_over()){

      clearInterval(interval);

      let text = "Remis";

      if(game.in_checkmate()){

        if(game.turn() === "w"){

          bot2.score += 2;
          text = `${bot2.name} gewinnt`;

        }else{

          bot1.score += 2;
          text = `${bot1.name} gewinnt`;
        }

      }else{

        bot1.score += 1;
        bot2.score += 1;
      }

      bot1.busy = false;
      bot2.busy = false;

      updateRanking();

      document.getElementById(
        `status${id}`
      ).innerText = text;

      setTimeout(()=>{

        card.remove();

        fillArena();

      },1500);

      return;
    }

    if(thinking) return;

    thinking = true;

    try{

      const move =
        await getBestMove(engine, game);

      if(move && move !== "(none)"){

        game.move({
          from: move.substring(0,2),
          to: move.substring(2,4),
          promotion:"q"
        });

        board.position(game.fen());
      }

    }catch(err){

      console.log(err);
    }

    thinking = false;

  }, MOVE_DELAY);
}

function fillArena(){

  while(true){

    const pair = pickPair();

    if(!pair) break;

    const [bot1, bot2] = pair;

    createBoard(
      bot1,
      bot2,
      "b" + Date.now() + Math.floor(Math.random()*999999)
    );
  }
}

function startArena(){

  arenaRunning = true;

  tournamentEnd =
    Date.now() +
    TOURNAMENT_MINUTES * 60 * 1000;

  document.getElementById(
    "games"
  ).innerHTML = "";

  bots.forEach(bot=>{

    bot.score = 0;
    bot.busy = false;
  });

  updateRanking();

  fillArena();
}

updateRanking();
</script>

</body>
</html>
