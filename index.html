<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess Arena</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 10px;
  background: #111;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

#board {
  width: 420px;
  touch-action: none;
}

.panel {
  width: 260px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn, select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
}

.btn:hover {
  background: #666;
}

.log {
  margin-top: 10px;
  font-size: 13px;
  max-height: 200px;
  overflow-y: auto;
  background: #1b1b1b;
  padding: 5px;
}
</style>
</head>

<body>

<header>♟ Mini Lichess Arena (Fixed Live Version)</header>

<div class="container">

<div id="board"></div>

<div class="panel">

<h3>Arena Controls</h3>

<select id="botLevel">
  <option value="random">Random Bot</option>
  <option value="easy">Easy Bot</option>
  <option value="medium">Medium Bot</option>
</select>

<button class="btn" onclick="startArena()">Start Arena</button>

<hr>

<div id="status"></div>

<h3>Live Matches</h3>
<div class="log" id="log"></div>

<h3>Results</h3>
<div id="results"></div>

</div>

</div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

let board = Chessboard('board', {
  draggable: true,
  position: 'start'
});

// ---------------- ARENA STATE ----------------

let arenaScores = {};
let arenaQueue = [];
let arenaRunning = false;

// ---------------- START ARENA ----------------

function startArena() {

  let bots = ["Bot Easy", "Bot Medium", "Bot Random"];

  arenaScores = {};
  bots.forEach(b => arenaScores[b] = 0);

  arenaQueue = [];

  for (let i = 0; i < bots.length; i++) {
    for (let j = i + 1; j < bots.length; j++) {
      arenaQueue.push([bots[i], bots[j]]);
    }
  }

  arenaRunning = true;

  log("Arena started...");
  nextMatch();
}

// ---------------- MATCH LOOP ----------------

function nextMatch() {

  if (!arenaRunning || arenaQueue.length === 0) {
    showResults();
    return;
  }

  let [a, b] = arenaQueue.shift();

  log("Match: " + a + " vs " + b);

  let result = playGame(a, b);

  if (result === "a") arenaScores[a] += 2;
  if (result === "b") arenaScores[b] += 2;
  if (result === "draw") {
    arenaScores[a] += 1;
    arenaScores[b] += 1;
  }

  setTimeout(nextMatch, 300);
}

// ---------------- REAL GAME SIM ----------------

function playGame(a, b) {

  let g = new Chess();

  for (let i = 0; i < 40; i++) {

    if (g.game_over()) break;

    let move = getMove(g, g.turn() === "w" ? a : b);

    g.move(move);
  }

  if (g.in_checkmate()) {
    return g.turn() === "w" ? "b" : "a";
  }

  return "draw";
}

// ---------------- BOT LOGIC ----------------

function getMove(game, bot) {

  let moves = game.moves();

  if (bot.includes("Easy")) {
    return moves[0];
  }

  if (bot.includes("Medium")) {
    return moves[Math.floor(Math.random() * (moves.length / 2))];
  }

  return moves[Math.floor(Math.random() * moves.length)];
}

// ---------------- OUTPUT ----------------

function showResults() {

  let html = "<b>Arena Finished</b><br>";

  let sorted = Object.entries(arenaScores)
    .sort((a,b) => b[1] - a[1]);

  for (let [name, score] of sorted) {
    html += name + ": " + score + " pts<br>";
  }

  document.getElementById("results").innerHTML = html;
}

// ---------------- LOG ----------------

function log(msg) {
  let el = document.getElementById("log");
  el.innerHTML += msg + "<br>";
  el.scrollTop = el.scrollHeight;
}

</script>

</body>
</html>
