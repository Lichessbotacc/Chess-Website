<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stockfish Arena Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#202124;
  color:white;
}

header {
  text-align:center;
  padding:10px;
  background:#111;
}

.container {
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:15px;
}

.panel {
  width:320px;
  background:#2a2a2a;
  padding:10px;
  border-radius:8px;
}

input, button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:5px;
}

button {
  background:#444;
  color:white;
}

button:hover {
  background:#666;
}

.game {
  background:#111;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
}

.board {
  font-size:22px;
  line-height:22px;
  width:160px;
  height:160px;
  display:grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  margin-top:5px;
}

.square {
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.light { background:#eeeed2; }
.dark { background:#769656; }

</style>
</head>

<body>

<header>♟ Stockfish Arena FIXED (real scoring + pieces)</header>

<div class="container">

<div id="games"></div>

<div class="panel">

<h3>Arena</h3>
<input id="botCount" type="number" value="4" min="2" max="10">
<button onclick="start()">Start</button>

<h3>Leaderboard</h3>
<div id="score"></div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish.js"></script>

<script>

// ---------------- STATE ----------------

let bots = [];
let scores = {};
let pairs = [];

// ---------------- ENGINE ----------------

function engine() {
  let e = Stockfish();
  e.postMessage("uci");
  e.postMessage("isready");
  return e;
}

// ---------------- START ----------------

function start() {

  let n = +document.getElementById("botCount").value;

  bots = [];
  scores = {};
  pairs = [];

  document.getElementById("games").innerHTML = "";

  for (let i=1;i<=n;i++) {
    let name = "Bot " + i;
    bots.push(name);
    scores[name] = 0;
  }

  for (let i=0;i<bots.length;i++) {
    for (let j=i+1;j<bots.length;j++) {
      pairs.push([bots[i], bots[j]]);
    }
  }

  next();
}

// ---------------- GAME LOOP ----------------

function next() {

  if (pairs.length === 0) {
    render();
    return;
  }

  let [w,b] = pairs.shift();

  let g = {
    white: w,
    black: b,
    chess: new Chess(),
    ew: engine(),
    eb: engine(),
    el: null,
    moves: [],
    board: createBoard(w,b)
  };

  play(g);

  setTimeout(next, 200);
}

// ---------------- BOARD ----------------

function createBoard(w,b) {

  let div = document.createElement("div");
  div.className = "game";

  div.innerHTML = `
    <b>${w} vs ${b}</b>
    <div class="board"></div>
    <small class="moves"></small>
  `;

  document.getElementById("games").prepend(div);

  return {
    el: div.querySelector(".board"),
    moves: div.querySelector(".moves")
  };
}

// ---------------- PLAY ----------------

function play(g) {

  let interval = setInterval(() => {

    if (g.chess.game_over()) {
      clearInterval(interval);
      finish(g);
      return;
    }

    let turn = g.chess.turn();
    let eng = turn === "w" ? g.ew : g.eb;

    eng.postMessage("position fen " + g.chess.fen());
    eng.postMessage("go depth 10");

    eng.onmessage = e => {

      if (e.data.includes("bestmove")) {

        let move = e.data.split(" ")[1];

        g.chess.move(move);
        g.moves.push(move);

        draw(g);
      }
    };

  }, 300);
}

// ---------------- DRAW ----------------

const pieces = {
  p:"♟", r:"♜", n:"♞", b:"♝", q:"♛", k:"♚",
  P:"♙", R:"♖", N:"♘", B:"♗", Q:"♕", K:"♔"
};

function draw(g) {

  let html = "";

  let board = g.chess.board();

  for (let r=0;r<8;r++) {
    for (let c=0;c<8;c++) {

      let piece = board[r][c];

      let isDark = (r+c)%2;

      html += `
        <div class="square ${isDark?'dark':'light'}">
          ${piece ? pieces[piece.type.toUpperCase() === piece.type ? piece.type : piece.type] : ""}
        </div>
      `;
    }
  }

  g.board.el.innerHTML = html;
  g.board.moves.innerText = g.moves.slice(-6).join(" ");
}

// ---------------- FINISH (REAL RESULT FIXED) ----------------

function finish(g) {

  let w = g.white;
  let b = g.black;

  if (g.chess.in_checkmate()) {
    let winner = g.chess.turn() === "w" ? b : w;
    scores[winner] += 2;
  } else {
    scores[w] += 1;
    scores[b] += 1;
  }

  render();
}

// ---------------- SCORE ----------------

function render() {

  let sorted = Object.entries(scores)
    .sort((a,b)=>b[1]-a[1]);

  let html = "<b>Leaderboard</b><br><br>";

  sorted.forEach((p,i)=>{
    html += `${i+1}. ${p[0]} — ${p[1]} pts<br>`;
  });

  document.getElementById("score").innerHTML = html;
}

</script>

</body>
</html>
