<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  background: #1f1f1f;
  color: white;
  font-family: Arial;
}

header {
  background: #111;
  padding: 15px;
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  border-bottom: 2px solid #333;
}

.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.board-card {
  background: #2b2b2b;
  border-radius: 14px;
  padding: 15px;
  width: 360px;
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

.player-row {
  display: flex;
  justify-content: space-between;
  margin: 8px 0;
  font-weight: bold;
}

.board {
  width: 330px;
  margin: auto;
}

.status {
  text-align: center;
  margin-top: 10px;
  color: #aaa;
}

.controls {
  text-align: center;
  margin-top: 20px;
}

button {
  background: #8bc34a;
  border: none;
  color: black;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  opacity: 0.9;
}

.ranking {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #2b2b2b;
  border-radius: 10px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #444;
  text-align: center;
}

th {
  background: #111;
}
</style>
</head>
<body>

<header>♟ Mini Lichess Arena</header>

<div class="controls">
  <button onclick="startArena()">Arena starten</button>
</div>

<div class="container" id="games"></div>

<div class="ranking">
  <h2>🏆 Ranking</h2>
  <table>
    <thead>
      <tr>
        <th>Platz</th>
        <th>Bot</th>
        <th>Punkte</th>
      </tr>
    </thead>
    <tbody id="rankingBody"></tbody>
  </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
const BOT_COUNT = 3;
const TOURNAMENT_MINUTES = 10;
const MOVE_DELAY = 120;

let arenaRunning = false;
let tournamentEnd = 0;
let lastPairings = [];

const botNames = [
  "Seher",
  "Berkay",
  "Bot",
  "Nova",
  "Blizzard",
  "Inferno",
  "Titan",
  "Ghost",
  "Falcon",
  "Hydra"
];

const bots = [];

for (let i = 0; i < BOT_COUNT; i++) {
  bots.push({
    name: botNames[i % botNames.length] + "_" + (i + 1),
    elo: 1800 + Math.floor(Math.random() * 400),
    score: 0,
    games: 0,
    busy: false
  });
}

let currentGames = [];

function updateRanking() {
  const tbody = document.getElementById("rankingBody");

  bots.sort((a,b) => b.score - a.score);

  tbody.innerHTML = "";

  bots.forEach((bot, index) => {
    tbody.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td>${bot.name}</td>
        <td>${bot.score}</td>
      </tr>
    `;
  });
}

function evaluateSimple(game) {
  const values = {
    p: 100,
    n: 320,
    b: 330,
    r: 500,
    q: 900,
    k: 20000
  };

  let score = 0;
  const board = game.board();

  for (let row of board) {
    for (let piece of row) {
      if (piece) {
        score += piece.color === 'w'
          ? values[piece.type]
          : -values[piece.type];
      }
    }
  }

  return score;
}

function botMove(game) {
  const moves = game.moves();
  if (moves.length === 0) return null;

  let bestMove = null;
  let bestScore = game.turn() === 'w' ? -999999 : 999999;

  for (let move of moves) {

    game.move(move);

    let score = evaluateSimple(game);

    const replies = game.moves();
    let replyScore = 0;

    for (let r of replies) {
      game.move(r);
      replyScore += evaluateSimple(game);
      game.undo();
    }

    score += (replyScore / Math.max(1, replies.length)) * 0.2;

    game.undo();

    if (game.turn() === 'w') {
      if (score > bestScore) {
        bestScore = score;
        bestMove = move;
      }
    } else {
      if (score < bestScore) {
        bestScore = score;
        bestMove = move;
      }
    }
  }

  return bestMove;
}

function pickPair() {

  const available = bots
    .filter(bot => !bot.busy)
    .sort((a,b) => b.score - a.score);

  if (available.length < 2) return null;

  for (let i = 0; i < available.length; i++) {
    const a = available[i];

    for (let j = i + 1; j < available.length; j++) {
      const b = available[j];

      const pair1 = `${a.name}-${b.name}`;
      const pair2 = `${b.name}-${a.name}`;

      if (!lastPairings.includes(pair1) && !lastPairings.includes(pair2)) {

        a.busy = true;
        b.busy = true;

        lastPairings.push(pair1);
        if (lastPairings.length > 50) lastPairings.shift();

        return [a, b];
      }
    }
  }

  return null;
}

function createBoard(bot1, bot2, boardId) {
  const gamesDiv = document.getElementById("games");

  const card = document.createElement("div");
  card.className = "board-card";

  card.innerHTML = `
    <div class="player-row">
      <span>⚪ ${bot1.name}</span>
      <span>${bot1.elo}</span>
    </div>

    <div id="board${boardId}" class="board"></div>

    <div class="player-row">
      <span>⚫ ${bot2.name}</span>
      <span>${bot2.elo}</span>
    </div>

    <div class="status" id="status${boardId}">
      Partie läuft...
    </div>
  `;

  gamesDiv.appendChild(card);

  const game = new Chess();

  const board = Chessboard(`board${boardId}`, {
    position: 'start',
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    draggable: false
  });

  const match = { game, board, bot1, bot2, boardId, card };
  currentGames.push(match);

  playGame(match);
}

function playGame(match) {
  const { game, board, bot1, bot2, boardId, card } = match;

  const interval = setInterval(() => {

    if (!arenaRunning) {
      clearInterval(interval);
      return;
    }

    if (Date.now() >= tournamentEnd) {
      arenaRunning = false;
      document.getElementById(`status${boardId}`).innerText = "🏁 Turnier beendet";
      clearInterval(interval);
      return;
    }

    if (game.game_over()) {
      clearInterval(interval);

      let text = "Remis";

      if (game.in_checkmate()) {
        if (game.turn() === 'w') {
          bot2.score += 2;
          text = `${bot2.name} gewinnt`;
        } else {
          bot1.score += 2;
          text = `${bot1.name} gewinnt`;
        }
      } else {
        bot1.score += 1;
        bot2.score += 1;
      }

      bot1.games++;
      bot2.games++;
      bot1.busy = false;
      bot2.busy = false;

      updateRanking();

      document.getElementById(`status${boardId}`).innerText = text;

      setTimeout(() => {
        card.remove();
        currentGames = currentGames.filter(g => g !== match);
        fillArena();
      }, 1000);

      return;
    }

    const move = botMove(game);

    if (move) {
      game.move(move);
      board.position(game.fen());
    }

  }, MOVE_DELAY);
}

function fillArena() {
  while (true) {
    const freeBots = bots.filter(b => !b.busy);
    if (freeBots.length < 2) break;

    const pair = pickPair();
    if (!pair) break;

    const [bot1, bot2] = pair;

    const boardId = Date.now() + Math.floor(Math.random() * 999999);

    createBoard(bot1, bot2, boardId);
  }
}

function startArena() {
  arenaRunning = true;

  document.getElementById("games").innerHTML = "";
  currentGames = [];

  bots.forEach(bot => {
    bot.score = 0;
    bot.games = 0;
    bot.busy = false;
  });

  tournamentEnd = Date.now() + (TOURNAMENT_MINUTES * 60 * 1000);

  updateRanking();
  fillArena();
}

updateRanking();
</script>

</body>
</html>
