<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess App</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
  overflow: hidden; /* FIX SCROLL */
}

header {
  text-align: center;
  padding: 10px;
  background: #111;
}

.container {
  display: flex;
  justify-content: center;
  margin-top: 20px;
  gap: 20px;
  flex-wrap: wrap;
}

#board {
  width: 420px;
  touch-action: none; /* FIX iPad SCROLL/DRAG ISSUE */
}

.panel {
  width: 220px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
}
</style>
</head>

<body>

<header>♟ Chess App (Fixed Version)</header>

<div class="container">

<div id="board"></div>

<div class="panel">
  <button class="btn" onclick="resetGame()">New Game</button>
  <button class="btn" onclick="toggleBot()">Toggle Bot</button>

  <div id="status"></div>
</div>

</div>

<!-- FIXED LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

let game = new Chess();
let bot = true;

// BOARD
let board = Chessboard('board', {
  draggable: true,
  position: 'start',

  pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png', // FIX FIGURES

  onDragStart: function () {
    if (game.game_over()) return false;
  },

  onDrop: function (source, target) {

    let move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';

    updateStatus();

    setTimeout(botMove, 300);
  },

  onSnapEnd: function () {
    board.position(game.fen());
  }
});

// BOT
function botMove() {
  if (!bot) return;
  if (game.game_over()) return;

  let moves = game.moves();
  let move = moves[Math.floor(Math.random() * moves.length)];

  game.move(move);
  board.position(game.fen());

  updateStatus();
}

// RESET
function resetGame() {
  game = new Chess();
  board.start();
  updateStatus();
}

// BOT TOGGLE
function toggleBot() {
  bot = !bot;
  document.getElementById("status").innerHTML = "Bot: " + bot;
}

// STATUS
function updateStatus() {
  document.getElementById("status").innerHTML =
    "Turn: " + game.turn() +
    "<br>Bot: " + bot;
}

updateStatus();

</script>

</body>
</html>
