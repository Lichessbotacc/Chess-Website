<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 10px;
  background: #111;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

#board {
  width: 420px;
  touch-action: none;
}

.panel {
  width: 240px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn, select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
}

.btn:hover {
  background: #666;
}
</style>
</head>

<body>

<header>♟ Mini Lichess Clone</header>

<div class="container">

<div id="board"></div>

<div class="panel">

<h3>Controls</h3>

<select id="botLevel">
  <option value="random">Bot: Random</option>
  <option value="easy">Bot: Easy</option>
  <option value="medium">Bot: Medium</option>
</select>

<button class="btn" onclick="resetGame()">New Game</button>
<button class="btn" onclick="toggleBot()">Toggle Bot</button>
<button class="btn" onclick="startTournament()">Start Tournament</button>

<div id="status"></div>

<hr>

<div id="tournament"></div>

</div>

</div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

let game = new Chess();
let botEnabled = true;

// BOT LEVELS
function botMove() {
  if (!botEnabled) return;
  if (game.game_over()) return;

  let moves = game.moves();
  let level = document.getElementById("botLevel").value;

  let move;

  if (level === "random") {
    move = moves[Math.floor(Math.random() * moves.length)];
  }

  if (level === "easy") {
    move = moves[0];
  }

  if (level === "medium") {
    move = moves[Math.floor(Math.random() * (moves.length / 2))];
  }

  game.move(move);
  board.position(game.fen());

  updateStatus();
}

// BOARD
let board = Chessboard('board', {
  draggable: true,
  position: 'start',

  pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',

  onDragStart: function () {
    if (game.game_over()) return false;
  },

  onDrop: function (source, target) {

    let move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';

    updateStatus();

    setTimeout(botMove, 400);
  },

  onSnapEnd: function () {
    board.position(game.fen());
  }
});

// RESET
function resetGame() {
  game = new Chess();
  board.start();
  updateStatus();
}

// BOT TOGGLE
function toggleBot() {
  botEnabled = !botEnabled;
  updateStatus();
}

// STATUS
function updateStatus() {
  document.getElementById("status").innerHTML =
    "Turn: " + game.turn() +
    "<br>Bot: " + botEnabled +
    "<br>Level: " + document.getElementById("botLevel").value;
}

updateStatus();


// ======================================================
// 🏆 FIX 1: ARENA SYSTEM STATE
// ======================================================

let arenaScores = {};
let arenaRunning = false;


// ======================================================
// 🏆 FIX 2: START TOURNAMENT (REAL GAMES)
// ======================================================

function startTournament() {

  let players = ["You", "Bot Easy", "Bot Medium", "Bot Random"];

  arenaScores = {};
  arenaRunning = true;

  players.forEach(p => arenaScores[p] = 0);

  let matches = [];

  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      matches.push([players[i], players[j]]);
    }
  }

  runMatches(matches);
}


// ======================================================
// 🏆 FIX 3: MATCH ENGINE (REAL CHESS GAMES)
// ======================================================

function runMatches(queue) {

  if (queue.length === 0) {
    showTournament();
    return;
  }

  let [a, b] = queue.shift();

  let result = playGame(a, b);

  if (result === "a") arenaScores[a] += 2;
  if (result === "b") arenaScores[b] += 2;
  if (result === "draw") {
    arenaScores[a] += 1;
    arenaScores[b] += 1;
  }

  setTimeout(() => runMatches(queue), 200);
}


// ======================================================
// 🏆 FIX 4: REAL BOT VS BOT GAME
// ======================================================

function playGame(a, b) {

  let g = new Chess();
  let maxMoves = 40;

  for (let i = 0; i < maxMoves; i++) {

    if (g.game_over()) break;

    let player = g.turn() === "w" ? a : b;

    let move = getBotMove(g, player);

    g.move(move);
  }

  if (g.in_checkmate()) {
    return g.turn() === "w" ? "b" : "a";
  }

  return "draw";
}


// ======================================================
// 🏆 FIX 5: BOT LOGIC (DIFFERENT LEVELS)
// ======================================================

function getBotMove(game, player) {

  let moves = game.moves();

  if (player.includes("Easy")) {
    return moves[0];
  }

  if (player.includes("Medium")) {
    return moves[Math.floor(Math.random() * (moves.length / 2))];
  }

  return moves[Math.floor(Math.random() * moves.length)];
}


// ======================================================
// 📊 OUTPUT
// ======================================================

function showTournament() {

  let html = "<h3>Tournament Result</h3>";

  let sorted = Object.entries(arenaScores)
    .sort((a,b) => b[1] - a[1]);

  for (let [name, score] of sorted) {
    html += name + ": " + score + " pts<br>";
  }

  document.getElementById("tournament").innerHTML = html;
}

</script>

</body>
</html>
