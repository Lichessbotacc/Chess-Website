<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess Arena</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 10px;
  background: #111;
}

.container {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}

#board {
  width: 420px;
  touch-action: none;
}

.panel {
  width: 260px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn, select, input {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
}

.btn:hover {
  background: #666;
}
</style>
</head>

<body>

<header>♟ Mini Lichess Arena System</header>

<div class="container">

<div id="board"></div>

<div class="panel">

<h3>Arena Setup</h3>

<label>Number of Bots</label>
<input id="botCount" type="number" value="3" min="2" max="10">

<label>Bot Type</label>
<select id="botType">
  <option value="random">Random Bot</option>
  <option value="easy">Easy Bot</option>
  <option value="medium">Medium Bot</option>
</select>

<button class="btn" onclick="startArena()">Start Arena</button>

<hr>

<div id="arenaStatus"></div>

</div>

</div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

let board = Chessboard('board', {
  draggable: true,
  position: 'start'
});

// ---------------- ARENA SYSTEM ----------------

let players = [];
let scores = {};

function createBots(count) {

  players = ["You"];
  scores = { "You": 0 };

  for (let i = 1; i <= count; i++) {
    let name = "Bot " + i;
    players.push(name);
    scores[name] = 0;
  }
}

function startArena() {

  let count = parseInt(document.getElementById("botCount").value);

  createBots(count);

  let botType = document.getElementById("botType").value;

  let results = [];

  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {

      let a = players[i];
      let b = players[j];

      let winner = simulateGame(a, b, botType);

      scores[winner] += 2;
    }
  }

  showArena();
}

// ---------------- GAME SIMULATION ----------------

function simulateGame(a, b, type) {

  let moves = ["a", "b"];
  let winner;

  if (type === "random") {
    winner = Math.random() > 0.5 ? a : b;
  }

  if (type === "easy") {
    winner = Math.random() > 0.65 ? a : b;
  }

  if (type === "medium") {
    winner = Math.random() > 0.45 ? a : b;
  }

  return winner;
}

// ---------------- DISPLAY ----------------

function showArena() {

  let sorted = Object.entries(scores)
    .sort((a,b) => b[1] - a[1]);

  let html = "<h3>Arena Results</h3>";

  for (let s of sorted) {
    html += s[0] + ": " + s[1] + " pts<br>";
  }

  document.getElementById("arenaStatus").innerHTML = html;
}

</script>

</body>
</html>
