<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess Clone</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  padding: 12px;
  background: #111;
  text-align: center;
}

.container {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

#board { width: 420px; }

.panel {
  width: 240px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  cursor: pointer;
  background: #444;
  color: white;
  border-radius: 5px;
}

.btn:hover { background: #666; }

.small {
  font-size: 13px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>♟ Mini Lichess Clone (Browser Edition)</header>

<div class="container">

<div id="board"></div>

<div class="panel">

<h3>Controls</h3>

<button class="btn" onclick="resetGame()">New Game</button>
<button class="btn" onclick="toggleBot()">Toggle Bot</button>
<button class="btn" onclick="startTournament()">Start Tournament</button>

<div class="small" id="status"></div>

<hr>

<h3>Ratings</h3>
<div id="ratings"></div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

let game = new Chess();
let botEnabled = true;

// --- RATINGS (LOCAL STORAGE)
let ratings = JSON.parse(localStorage.getItem("ratings")) || {
  Player: 1200,
  Bot: 1200,
  Bot2: 1200
};

function saveRatings() {
  localStorage.setItem("ratings", JSON.stringify(ratings));
}

function updateRatingsUI() {
  document.getElementById("ratings").innerHTML =
    Object.entries(ratings)
      .map(([k,v]) => k + ": " + v)
      .join("<br>");
}

updateRatingsUI();

// --- BOARD
let board = Chessboard('board', {
  draggable: true,
  position: 'start',

  onDrop: function (source, target) {

    let move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';

    updateStatus();

    setTimeout(botMove, 400);
  },

  onSnapEnd: function () {
    board.position(game.fen());
  }
});

// --- BOT (random legal move)
function botMove() {
  if (!botEnabled) return;
  if (game.game_over()) return;

  let moves = game.moves();
  let move = moves[Math.floor(Math.random() * moves.length)];

  game.move(move);
  board.position(game.fen());

  updateStatus();
}

// --- RESET
function resetGame() {
  game = new Chess();
  board.start();
  updateStatus();
}

// --- BOT TOGGLE
function toggleBot() {
  botEnabled = !botEnabled;
  document.getElementById("status").innerHTML =
    "Bot: " + (botEnabled ? "ON" : "OFF");
}

// --- STATUS
function updateStatus() {
  document.getElementById("status").innerHTML =
    "Turn: " + game.turn() + "<br>" +
    (game.game_over() ? "Game Over" : "Playing");
}

// --- SIMPLE TOURNAMENT SYSTEM (LOCAL SIM)
function startTournament() {

  let players = ["Player", "Bot", "Bot2"];
  let results = {};

  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {

      let a = players[i];
      let b = players[j];

      let winner = Math.random() > 0.5 ? a : b;

      results[winner] = (results[winner] || 0) + 1;

      // rating update
      ratings[winner] += 10;
      ratings[winner === a ? b : a] -= 10;
    }
  }

  saveRatings();
  updateRatingsUI();

  alert("Tournament finished!");
}

// INIT
updateStatus();

</script>

</body>
</html>
