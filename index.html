<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chess (Lichess Style)</title>

  <!-- Chessboard CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #202124;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 15px;
      background: #111;
      display: flex;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #board {
      width: 420px;
    }

    .panel {
      width: 220px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      cursor: pointer;
      background: #444;
      color: white;
      border-radius: 5px;
    }

    .btn:hover {
      background: #666;
    }

    .moves {
      font-size: 14px;
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .clock {
      margin-top: 10px;
      font-size: 14px;
      background: #1b1b1b;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>
  <div>♟ MyChess</div>
  <div>Rating: 1200 (demo)</div>
</header>

<div class="container">

  <div id="board"></div>

  <div class="panel">
    <h3>Game Panel</h3>

    <button class="btn" onclick="resetGame()">New Game</button>

    <div class="clock" id="clock">
      White: 5:00 <br>
      Black: 5:00
    </div>

    <div class="moves" id="moves"></div>
  </div>

</div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
let game = new Chess();

let whiteTime = 300;
let blackTime = 300;
let clockInterval;
let clockRunning = false;

let board = Chessboard('board', {
  draggable: true,
  position: 'start',

  onDragStart: function () {
    if (game.game_over()) return false;
  },

  onDrop: function (source, target) {

    let move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';

    updateMoves();
    startClock();
  },

  onSnapEnd: function () {
    board.position(game.fen());
  }
});

// MOVE LIST
function updateMoves() {
  let history = game.history();
  let html = "";

  for (let i = 0; i < history.length; i += 2) {
    html += (i / 2 + 1) + ". " + history[i];

    if (history[i + 1]) {
      html += " " + history[i + 1];
    }

    html += "<br>";
  }

  document.getElementById("moves").innerHTML = html;
}

// RESET
function resetGame() {
  game = new Chess();
  board.start();

  whiteTime = 300;
  blackTime = 300;

  updateMoves();
  updateClock();
  stopClock();
}

// CLOCK START
function startClock() {
  if (clockRunning) return;

  clockRunning = true;

  clockInterval = setInterval(() => {

    if (game.game_over()) {
      stopClock();
      return;
    }

    if (game.turn() === "w") {
      whiteTime--;
    } else {
      blackTime--;
    }

    updateClock();

    if (whiteTime <= 0 || blackTime <= 0) {
      stopClock();
      alert("Time over!");
    }

  }, 1000);
}

// CLOCK STOP
function stopClock() {
  clearInterval(clockInterval);
  clockRunning = false;
}

// CLOCK UI
function updateClock() {
  document.getElementById("clock").innerHTML =
    "White: " + formatTime(whiteTime) + "<br>" +
    "Black: " + formatTime(blackTime);
}

// TIME FORMAT
function formatTime(sec) {
  let m = Math.floor(sec / 60);
  let s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}

// INIT
updateMoves();
updateClock();

</script>

</body>
</html>
