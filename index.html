<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess Arena</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
}

header {
  text-align: center;
  padding: 10px;
  background: #111;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

#board {
  width: 420px;
}

.panel {
  width: 300px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn, select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
}

.btn:hover {
  background: #666;
}

.log {
  margin-top: 10px;
  font-size: 13px;
  max-height: 180px;
  overflow-y: auto;
  background: #1b1b1b;
  padding: 5px;
}

.liveGames {
  margin-top: 15px;
  font-size: 12px;
  background: #111;
  padding: 8px;
  border-radius: 5px;
}
</style>
</head>

<body>

<header>♟ Mini Lichess Arena (Live Fixed)</header>

<div class="container">

<div id="board"></div>

<div class="panel">

<h3>Arena Controls</h3>

<button class="btn" onclick="startArena()">Start Arena</button>

<h3>Live Matches</h3>
<div class="log" id="log"></div>

<h3>Live Bot Games</h3>
<div class="liveGames" id="liveGames"></div>

<h3>Results</h3>
<div id="results"></div>

</div>
</div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

// ✅ FIX: Piece Theme (WICHTIG für sichtbare Figuren)
let board = Chessboard('board', {
  draggable: false,
  position: 'start',
  pieceTheme: 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/img/chesspieces/wikipedia/{piece}.png'
});

// ---------------- STATE ----------------

let arenaScores = {};
let arenaQueue = [];
let arenaRunning = false;

let liveGames = []; // 🟢 echte laufende Bot-Games

// ---------------- START ----------------

function startArena() {

  let bots = ["Bot Easy", "Bot Medium", "Bot Random"];

  arenaScores = {};
  bots.forEach(b => arenaScores[b] = 0);

  arenaQueue = [];

  for (let i = 0; i < bots.length; i++) {
    for (let j = i + 1; j < bots.length; j++) {
      arenaQueue.push([bots[i], bots[j]]);
    }
  }

  arenaRunning = true;

  log("Arena gestartet...");
  nextMatch();
}

// ---------------- MATCH LOOP ----------------

function nextMatch() {

  if (!arenaRunning || arenaQueue.length === 0) {
    showResults();
    return;
  }

  let [a, b] = arenaQueue.shift();

  log("Match: " + a + " vs " + b);

  let game = createLiveGame(a, b);
  liveGames.push(game);

  let result = simulateGame(game);

  if (result === "a") arenaScores[a] += 2;
  if (result === "b") arenaScores[b] += 2;
  if (result === "draw") {
    arenaScores[a] += 1;
    arenaScores[b] += 1;
  }

  renderLiveGames();

  setTimeout(nextMatch, 400);
}

// ---------------- LIVE GAME ----------------

function createLiveGame(a, b) {
  return {
    white: a,
    black: b,
    game: new Chess(),
    moves: []
  };
}

// ---------------- SIMULATION + LIVE DISPLAY ----------------

function simulateGame(liveGame) {

  let g = liveGame.game;

  for (let i = 0; i < 30; i++) {

    if (g.game_over()) break;

    let bot = g.turn() === "w" ? liveGame.white : liveGame.black;

    let move = getMove(g, bot);
    g.move(move);

    liveGame.moves.push(move);

    renderLiveGames();
  }

  if (g.in_checkmate()) {
    return g.turn() === "w" ? "b" : "a";
  }

  return "draw";
}

// ---------------- BOT LOGIC ----------------

function getMove(game, bot) {

  let moves = game.moves();

  if (bot.includes("Easy")) return moves[0];

  if (bot.includes("Medium")) {
    return moves[Math.floor(Math.random() * Math.max(1, moves.length / 2))];
  }

  return moves[Math.floor(Math.random() * moves.length)];
}

// ---------------- LIVE DISPLAY ----------------

function renderLiveGames() {

  let html = "";

  liveGames.slice(-5).forEach((g, i) => {
    html += `
      <div>
        <b>${g.white} vs ${g.black}</b><br>
        Moves: ${g.moves.slice(-6).join(" ")}
      </div><hr>
    `;
  });

  document.getElementById("liveGames").innerHTML = html;
}

// ---------------- RESULTS ----------------

function showResults() {

  let html = "<b>Arena Finished</b><br>";

  let sorted = Object.entries(arenaScores)
    .sort((a,b) => b[1] - a[1]);

  for (let [name, score] of sorted) {
    html += name + ": " + score + " pts<br>";
  }

  document.getElementById("results").innerHTML = html;
}

// ---------------- LOG ----------------

function log(msg) {
  let el = document.getElementById("log");
  el.innerHTML += msg + "<br>";
  el.scrollTop = el.scrollHeight;
}

</script>

</body>
</html>
