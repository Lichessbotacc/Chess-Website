<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyChess - Lichess Feel</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #202124;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 12px;
      background: #111;
      text-align: center;
    }

    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #board {
      width: 420px;
    }

    .panel {
      width: 240px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      cursor: pointer;
      background: #444;
      color: white;
      border-radius: 5px;
    }

    .btn:hover {
      background: #666;
    }

    .moves {
      font-size: 14px;
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .clock {
      margin-top: 10px;
      background: #1b1b1b;
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>
  ♟ MyChess – Lichess Style V3
</header>

<div class="container">

  <div id="board"></div>

  <div class="panel">

    <button class="btn" onclick="resetGame()">New Game</button>

    <div class="clock" id="clock"></div>

    <div class="moves" id="moves"></div>

  </div>

</div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
let game = new Chess();

let whiteTime = 300;
let blackTime = 300;
let clockInterval;
let clockRunning = false;

let moveSound = new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");

// BOARD
let board = Chessboard('board', {
  draggable: true,
  position: 'start',

  onDragStart: function (source, piece) {
    if (game.game_over()) return false;
  },

  onDrop: function (source, target) {

    let move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';

    moveSound.play();

    updateUI();
    startClock();
  },

  onSnapEnd: function () {
    board.position(game.fen());
  },

  onMouseoverSquare: function(square) {
    showMoves(square);
  },

  onMouseoutSquare: function(square) {
    removeHighlights();
  }
});

// SHOW LEGAL MOVES (lichess style idea simplified)
function showMoves(square) {
  let moves = game.moves({ square: square, verbose: true });

  if (moves.length === 0) return;

  moves.forEach(m => {
    highlightSquare(m.to);
  });
}

// HIGHLIGHT SQUARE
function highlightSquare(square) {
  let el = document.querySelector('[data-square="' + square + '"]');
  if (el) {
    el.style.background = "rgba(0,255,0,0.3)";
  }
}

// CLEAR HIGHLIGHTS
function removeHighlights() {
  document.querySelectorAll('.square-55d63').forEach(el => {
    el.style.background = "";
  });
}

// MOVE LIST
function updateUI() {
  let history = game.history();
  let html = "";

  for (let i = 0; i < history.length; i += 2) {
    html += (i / 2 + 1) + ". " + history[i];

    if (history[i + 1]) html += " " + history[i + 1];

    html += "<br>";
  }

  document.getElementById("moves").innerHTML = html;
}

// RESET
function resetGame() {
  game = new Chess();
  board.start();

  whiteTime = 300;
  blackTime = 300;

  updateUI();
  updateClock();
  stopClock();
}

// CLOCK
function startClock() {
  if (clockRunning) return;

  clockRunning = true;

  clockInterval = setInterval(() => {

    if (game.game_over()) return stopClock();

    if (game.turn() === "w") whiteTime--;
    else blackTime--;

    updateClock();

  }, 1000);
}

function stopClock() {
  clearInterval(clockInterval);
  clockRunning = false;
}

function updateClock() {
  document.getElementById("clock").innerHTML =
    "White: " + format(whiteTime) + "<br>" +
    "Black: " + format(blackTime);
}

function format(t) {
  let m = Math.floor(t / 60);
  let s = t % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}

// INIT
updateUI();
updateClock();

</script>

</body>
</html>
