<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lichess Arena</title>

<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #202124;
  color: white;
}

header {
  text-align: center;
  padding: 10px;
  background: #111;
  font-size: 18px;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

#board {
  width: 420px;
}

.panel {
  width: 320px;
  background: #2a2a2a;
  padding: 10px;
  border-radius: 8px;
}

.btn, input {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #444;
  color: white;
  border-radius: 5px;
}

.btn:hover {
  background: #666;
}

.box {
  margin-top: 10px;
  background: #111;
  padding: 8px;
  border-radius: 5px;
  font-size: 13px;
  max-height: 200px;
  overflow-y: auto;
}
</style>
</head>

<body>

<header>♟ Mini Lichess Arena System</header>

<div class="container">

<div id="board"></div>

<div class="panel">

<h3>Arena Setup</h3>

<label>Bot Anzahl</label>
<input id="botCount" type="number" min="2" max="20" value="5">

<button class="btn" onclick="startArena()">Start Arena</button>

<h3>Live Games</h3>
<div class="box" id="liveGames"></div>

<h3>Leaderboard</h3>
<div class="box" id="results"></div>

</div>
</div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

// ♟ Board fix (FIGUREN SICHTBAR!)
let board = Chessboard('board', {
  position: 'start',
  draggable: false,
  pieceTheme: 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/img/chesspieces/wikipedia/{piece}.png'
});

// ---------------- STATE ----------------

let bots = [];
let scores = {};
let pairs = [];
let games = [];
let running = false;

// ---------------- START ARENA ----------------

function startArena() {

  let count = parseInt(document.getElementById("botCount").value);

  bots = [];
  scores = {};
  pairs = [];
  games = [];

  for (let i = 1; i <= count; i++) {
    let name = "Bot " + i;
    bots.push(name);
    scores[name] = 0;
  }

  // Round Robin
  for (let i = 0; i < bots.length; i++) {
    for (let j = i + 1; j < bots.length; j++) {
      pairs.push([bots[i], bots[j]]);
    }
  }

  running = true;
  logLive("Arena gestartet mit " + count + " Bots");

  nextMatch();
}

// ---------------- MATCH LOOP ----------------

function nextMatch() {

  if (!running || pairs.length === 0) {
    renderBoard();
    return;
  }

  let [w, b] = pairs.shift();

  let gameObj = {
    white: w,
    black: b,
    game: new Chess(),
    moves: []
  };

  games.push(gameObj);

  playGame(gameObj);

  renderLive();
  renderScores();

  setTimeout(nextMatch, 300);
}

// ---------------- GAME SIMULATION ----------------

function playGame(gObj) {

  let g = gObj.game;

  for (let i = 0; i < 35; i++) {

    if (g.game_over()) break;

    let bot = g.turn() === "w" ? gObj.white : gObj.black;

    let move = getMove(g, bot);
    g.move(move);

    gObj.moves.push(move);
  }

  let result = "draw";

  if (g.in_checkmate()) {
    result = g.turn() === "w" ? "b" : "a";
  }

  if (result === "a") scores[gObj.white] += 2;
  if (result === "b") scores[gObj.black] += 2;
  if (result === "draw") {
    scores[gObj.white] += 1;
    scores[gObj.black] += 1;
  }
}

// ---------------- BOT AI ----------------

function getMove(game, bot) {

  let moves = game.moves();

  if (bot.includes("1") || bot.includes("2")) {
    return moves[0];
  }

  if (bot.includes("3") || bot.includes("4")) {
    return moves[Math.floor(Math.random() * Math.max(1, moves.length / 2))];
  }

  return moves[Math.floor(Math.random() * moves.length)];
}

// ---------------- LIVE UI ----------------

function renderLive() {

  let html = "<b>Live Games</b><br><br>";

  games.slice(-6).forEach(g => {
    html += `
      <div>
        ♟ ${g.white} vs ${g.black}<br>
        <small>${g.moves.slice(-8).join(" ")}</small>
      </div><hr>
    `;
  });

  document.getElementById("liveGames").innerHTML = html;
}

// ---------------- SCOREBOARD ----------------

function renderScores() {

  let sorted = Object.entries(scores)
    .sort((a,b) => b[1] - a[1]);

  let html = "<b>Leaderboard</b><br><br>";

  sorted.forEach((p, i) => {
    html += `${i+1}. ${p[0]} — ${p[1]} pts<br>`;
  });

  document.getElementById("results").innerHTML = html;
}

// ---------------- LOG ----------------

function logLive(msg) {
  console.log(msg);
}

</script>

</body>
</html>
