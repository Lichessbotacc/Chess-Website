<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lichess Arena Canvas</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#202124;
  color:white;
}

header {
  padding:10px;
  background:#111;
  text-align:center;
  font-size:18px;
}

.container {
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:15px;
}

.panel {
  width:320px;
  background:#2a2a2a;
  padding:10px;
  border-radius:8px;
}

input, button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:5px;
}

button {
  background:#444;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#666;
}

#boards {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  max-width:900px;
}

.game {
  background:#111;
  padding:8px;
  border-radius:6px;
}

canvas {
  background:#eee;
  display:block;
}
</style>
</head>

<body>

<header>♟ Lichess Arena (Bot vs Bot Live)</header>

<div class="container">

<div id="boards"></div>

<div class="panel">

<h3>Arena Setup</h3>

<input id="botCount" type="number" value="6" min="2" max="20">
<button onclick="startArena()">Start Arena</button>

<h3>Leaderboard</h3>
<div id="scores"></div>

</div>
</div>

<script>

// ---------------- STATE ----------------

let bots = [];
let scores = {};
let pairs = [];
let games = [];

// ---------------- START ----------------

function startArena() {

  let count = parseInt(document.getElementById("botCount").value);

  bots = [];
  scores = {};
  pairs = [];
  games = [];

  document.getElementById("boards").innerHTML = "";

  for (let i = 1; i <= count; i++) {
    let name = "Bot " + i;
    bots.push(name);
    scores[name] = 0;
  }

  for (let i = 0; i < bots.length; i++) {
    for (let j = i + 1; j < bots.length; j++) {
      pairs.push([bots[i], bots[j]]);
    }
  }

  nextGame();
}

// ---------------- GAME LOOP ----------------

function nextGame() {

  if (pairs.length === 0) {
    renderScores();
    return;
  }

  let [w, b] = pairs.shift();

  let game = {
    white: w,
    black: b,
    board: initBoard(w, b),
    state: initState()
  };

  games.push(game);

  playGame(game);

  setTimeout(nextGame, 400);
}

// ---------------- BOARD ----------------

function initBoard(w, b) {

  let container = document.createElement("div");
  container.className = "game";

  let title = document.createElement("div");
  title.innerHTML = `<b>${w} vs ${b}</b>`;
  container.appendChild(title);

  let canvas = document.createElement("canvas");
  canvas.width = 160;
  canvas.height = 160;

  container.appendChild(canvas);

  document.getElementById("boards").prepend(container);

  return { canvas, ctx: canvas.getContext("2d") };
}

// ---------------- CHESS STATE (MINIMAL) ----------------

function initState() {
  return {
    turn: "w",
    move: 0,
    moves: []
  };
}

// ---------------- BOT GAME ----------------

function playGame(game) {

  let interval = setInterval(() => {

    let s = game.state;

    if (s.move > 25) {
      finishGame(game);
      clearInterval(interval);
      return;
    }

    let bot = s.turn === "w" ? game.white : game.black;

    let move = getMove(bot);

    s.moves.push(move);

    s.turn = s.turn === "w" ? "b" : "w";
    s.move++;

    drawBoard(game.board, s);

  }, 120);
}

// ---------------- BOT AI ----------------

function getMove(bot) {

  let moves = ["e4", "d4", "Nf3", "c4", "a3", "h3"];

  if (bot.includes("1") || bot.includes("2")) return moves[0];

  return moves[Math.floor(Math.random() * moves.length)];
}

// ---------------- DRAW BOARD ----------------

function drawBoard(board, state) {

  let ctx = board.ctx;

  ctx.clearRect(0,0,160,160);

  // simple grid
  for (let i=0;i<8;i++) {
    for (let j=0;j<8;j++) {
      ctx.fillStyle = (i+j)%2 ? "#769656" : "#eeeed2";
      ctx.fillRect(i*20,j*20,20,20);
    }
  }

  ctx.fillStyle = "black";
  ctx.font = "10px Arial";
  ctx.fillText(state.moves.slice(-1)[0] || "", 5, 155);
}

// ---------------- RESULT ----------------

function finishGame(game) {

  let winner = Math.random() > 0.5 ? game.white : game.black;

  scores[winner] += 2;

  renderScores();
}

// ---------------- SCOREBOARD ----------------

function renderScores() {

  let sorted = Object.entries(scores)
    .sort((a,b) => b[1]-a[1]);

  let html = "<b>Leaderboard</b><br><br>";

  sorted.forEach((p,i) => {
    html += `${i+1}. ${p[0]} — ${p[1]} pts<br>`;
  });

  document.getElementById("scores").innerHTML = html;
}

</script>

</body>
</html>
