<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stockfish Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#202124;
  color:white;
}

header {
  text-align:center;
  padding:10px;
  background:#111;
}

.container {
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:15px;
}

.panel {
  width:320px;
  background:#2a2a2a;
  padding:10px;
  border-radius:8px;
}

input, button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:5px;
}

button {
  background:#444;
  color:white;
}

button:hover {
  background:#666;
}

#games {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  max-width:900px;
}

.game {
  background:#111;
  padding:8px;
  border-radius:6px;
}

canvas {
  background:#eee;
}
</style>
</head>

<body>

<header>♟ Stockfish Bot Arena (Lichess-style)</header>

<div class="container">

<div id="games"></div>

<div class="panel">

<h3>Arena Setup</h3>

<input id="botCount" type="number" value="4" min="2" max="10">
<button onclick="startArena()">Start Arena</button>

<h3>Leaderboard</h3>
<div id="scores"></div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<!-- STOCKFISH -->
<script src="https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish.js"></script>

<script>

// ---------------- STATE ----------------

let bots = [];
let scores = {};
let pairs = [];
let games = [];

// ---------------- STOCKFISH ENGINE ----------------

function createEngine() {
  let engine = Stockfish();
  engine.postMessage("uci");
  engine.postMessage("isready");
  return engine;
}

// ---------------- START ----------------

function startArena() {

  let count = +document.getElementById("botCount").value;

  bots = [];
  scores = {};
  pairs = [];
  games = [];

  document.getElementById("games").innerHTML = "";

  for (let i=1;i<=count;i++) {
    let name = "SF Bot " + i;
    bots.push(name);
    scores[name] = 0;
  }

  for (let i=0;i<bots.length;i++) {
    for (let j=i+1;j<bots.length;j++) {
      pairs.push([bots[i], bots[j]]);
    }
  }

  nextGame();
}

// ---------------- GAME LOOP ----------------

function nextGame() {

  if (pairs.length === 0) {
    renderScores();
    return;
  }

  let [w,b] = pairs.shift();

  let game = {
    white: w,
    black: b,
    chess: new Chess(),
    engineW: createEngine(),
    engineB: createEngine(),
    moves: [],
    id: Date.now() + Math.random(),
    board: createUI(w,b)
  };

  games.push(game);

  play(game);

  setTimeout(nextGame, 300);
}

// ---------------- UI ----------------

function createUI(w,b) {

  let div = document.createElement("div");
  div.className = "game";

  div.innerHTML = `
    <b>${w} vs ${b}</b><br>
    <canvas width="160" height="160"></canvas>
    <div class="moves"></div>
  `;

  document.getElementById("games").prepend(div);

  return {
    canvas: div.querySelector("canvas"),
    ctx: div.querySelector("canvas").getContext("2d"),
    moves: div.querySelector(".moves")
  };
}

// ---------------- PLAY ----------------

function play(g) {

  let interval = setInterval(() => {

    if (g.chess.game_over()) {
      clearInterval(interval);
      finish(g);
      return;
    }

    let turn = g.chess.turn();

    let engine = turn === "w" ? g.engineW : g.engineB;

    engine.postMessage("position fen " + g.chess.fen());
    engine.postMessage("go depth 10");

    engine.onmessage = function(event) {

      let line = event.data;

      if (line.includes("bestmove")) {

        let move = line.split(" ")[1];

        g.chess.move(move);
        g.moves.push(move);

        draw(g);
      }
    };

  }, 300);
}

// ---------------- DRAW ----------------

function draw(g) {

  let ctx = g.board.ctx;
  let c = g.board.canvas;

  ctx.clearRect(0,0,160,160);

  for (let i=0;i<8;i++) {
    for (let j=0;j<8;j++) {
      ctx.fillStyle = (i+j)%2 ? "#769656" : "#eeeed2";
      ctx.fillRect(i*20,j*20,20,20);
    }
  }

  ctx.fillStyle = "black";
  ctx.fillText(g.moves.slice(-1)[0] || "", 10, 150);

  g.board.moves.innerText = g.moves.slice(-6).join(" ");
}

// ---------------- FINISH ----------------

function finish(g) {

  let winner = Math.random() > 0.5 ? g.white : g.black;

  scores[winner] += 2;

  renderScores();
}

// ---------------- SCORE ----------------

function renderScores() {

  let sorted = Object.entries(scores)
    .sort((a,b)=>b[1]-a[1]);

  let html = "<b>Leaderboard</b><br><br>";

  sorted.forEach((p,i)=>{
    html += `${i+1}. ${p[0]} — ${p[1]} pts<br>`;
  });

  document.getElementById("scores").innerHTML = html;
}

</script>

</body>
</html>
